<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persona 3 - S.E.E.S. Database</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --p3-dark: #070d1e;
      --p3-darker: #020611;
      --p3-cyan: #00d2ff;
      --p3-blue-glow: rgba(0, 210, 255, 0.25);
    }
    body {
      background-color: var(--p3-darker);
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .bg-p3-dark { background-color: var(--p3-dark) !important; }
    .bg-p3-darker { background-color: var(--p3-darker) !important; }
    .border-p3-cyan { border-color: var(--p3-cyan) !important; }
    .text-p3-cyan { color: var(--p3-cyan) !important; }
    .badge-p3 { background-color: var(--p3-cyan); color: #000; font-weight: bold; }
    .p3-divider {
      width: 60px;
      height: 3px;
      background: var(--p3-cyan);
      box-shadow: 0 0 10px var(--p3-cyan);
    }
    .p3-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background-color: #0b152d !important;
      border: 1px solid rgba(0, 210, 255, 0.3) !important;
    }
    .p3-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px var(--p3-blue-glow) !important;
      border-color: var(--p3-cyan) !important;
    }
  </style>
</head>
<body>

<header>

    <div class="container">

        <span class="badge badge-p3 px-2 py-1 rounded-1">P3R</span>

        <span class="text-p3-cyan fw-light fs-6">| S.E.E.S. ARCHIVE</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navP3" aria-controls="navP3" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navP3">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item"><a class="nav-link active fw-semibold" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link text-light opacity-75" href="#dark-hour">Hora Oscura</a></li>
          <li class="nav-item"><a class="nav-link text-light opacity-75" href="#galeria">Galería</a></li>
          <li class="nav-item"><a class="nav-link text-light opacity-75" href="#tartarus">Tartarus</a></li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-sm btn-outline-info rounded-pill px-3 fw-bold" href="#galeria">Ver Agentes</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
